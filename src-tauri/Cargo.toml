[workspace]
resolver = "2"

[workspace.package]
version = "1.2.4"

# TZAP 0.2.4 includes the Unicode-safe volume-name parsing fix that previously
# required a temporary sibling-checkout patch.

[package]
name = "zmanager-desktop"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
default = ["hosted-online"]
# Hosted account sign-in is part of the product build. The client ID is public
# configuration; private session material remains in the native secure store.
hosted-online = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openssl = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
url = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-wdio = "1.3.0"
tauri-plugin-wdio-webdriver = "1.3.0"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
unicode-normalization = "0.1"
zmanager-shell-contract = { path = "../crates/zmanager-shell-contract" }
zmanager-core = { path = "../../zmanager/crates/zmanager-core", package = "zmanager-core" }
zmanager-tzap-hosted = { path = "../../zmanager/crates/zmanager-tzap-hosted", features = ["reqwest-transport"] }
zmanager-localsend = { path = "../../zmanager/crates/zmanager-localsend" }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tauri-plugin-deep-link = "2"

[target.'cfg(windows)'.dependencies]
png = "0.18.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
] }
windows-core = "0.61.2"
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18.2"
gio = "0.18.4"
glib = "0.18.5"
gtk = "0.18.2"
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }
x11 = { version = "2.21", features = ["xlib"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
