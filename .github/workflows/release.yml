name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZMANAGER_ZMANAGER_REF: v2.1.2

jobs:
  package-macos:
    name: macOS ${{ matrix.arch }} package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            artifact-name: zmanager-macos-arm64
          - arch: x86_64
            runner: macos-15-intel
            artifact-name: zmanager-macos-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Bind release version
        run: |
          echo "ZMANAGER_RELEASE_BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Install build and test dependencies
        run: |
          brew install cmake lz4 xz ripgrep
          rustup target add "${{ matrix.arch == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}"
          npm ci
          npx playwright install --with-deps chromium
          scripts/ensure-sibling-repos.sh
          scripts/sync-uniffi-swift-bindings.sh

      - name: Run release verification tests
        run: |
          npm run test:frontend
          npm run test:architecture
          npm run test:e2e
          (cd src-tauri && cargo fmt --check)
          (cd src-tauri && cargo clippy --all-targets --all-features -- -D warnings)
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path crates/zmanager-shell-contract/Cargo.toml
          swift test --package-path native/macos

      - name: Determine macOS signing mode
        id: macos_signing
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_MAIN_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_MAIN_PROVISIONING_PROFILE_BASE64 }}
          MACOS_FINDER_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_FINDER_PROVISIONING_PROFILE_BASE64 }}
          MACOS_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.MACOS_NOTARY_PRIVATE_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$MACOS_DEVELOPER_ID_P12_BASE64" ]] || missing+=(MACOS_DEVELOPER_ID_P12_BASE64)
          [[ -n "$MACOS_DEVELOPER_ID_P12_PASSWORD" ]] || missing+=(MACOS_DEVELOPER_ID_P12_PASSWORD)
          [[ -n "$MACOS_MAIN_PROVISIONING_PROFILE_BASE64" ]] || missing+=(MACOS_MAIN_PROVISIONING_PROFILE_BASE64)
          [[ -n "$MACOS_FINDER_PROVISIONING_PROFILE_BASE64" ]] || missing+=(MACOS_FINDER_PROVISIONING_PROFILE_BASE64)
          [[ -n "$MACOS_NOTARY_PRIVATE_KEY_BASE64" ]] || missing+=(MACOS_NOTARY_PRIVATE_KEY_BASE64)
          [[ -n "$MACOS_NOTARY_KEY_ID" ]] || missing+=(MACOS_NOTARY_KEY_ID)
          [[ -n "$MACOS_NOTARY_ISSUER_ID" ]] || missing+=(MACOS_NOTARY_ISSUER_ID)

          if ((${#missing[@]} == 0)); then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "macOS Developer ID signing and notarization are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS release credentials are incomplete; building an ad-hoc-signed testing package. Missing: ${missing[*]}"
          fi

      - name: Import Developer ID and notary credentials
        if: steps.macos_signing.outputs.configured == 'true'
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_MAIN_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_MAIN_PROVISIONING_PROFILE_BASE64 }}
          MACOS_FINDER_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_FINDER_PROVISIONING_PROFILE_BASE64 }}
          MACOS_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.MACOS_NOTARY_PRIVATE_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${MACOS_DEVELOPER_ID_P12_BASE64:?missing Developer ID certificate}"
          : "${MACOS_DEVELOPER_ID_P12_PASSWORD:?missing certificate password}"
          : "${MACOS_MAIN_PROVISIONING_PROFILE_BASE64:?missing main Developer ID provisioning profile}"
          : "${MACOS_FINDER_PROVISIONING_PROFILE_BASE64:?missing Finder Developer ID provisioning profile}"
          : "${MACOS_NOTARY_PRIVATE_KEY_BASE64:?missing notary API key}"
          : "${MACOS_NOTARY_KEY_ID:?missing notary key ID}"
          : "${MACOS_NOTARY_ISSUER_ID:?missing notary issuer ID}"
          keychain="$RUNNER_TEMP/zmanager-release.keychain-db"
          certificate="$RUNNER_TEMP/zmanager-developer-id.p12"
          api_key="$RUNNER_TEMP/AuthKey_${MACOS_NOTARY_KEY_ID}.p8"
          main_profile="$RUNNER_TEMP/ZManagerMain.provisionprofile"
          finder_profile="$RUNNER_TEMP/ZManagerFinder.provisionprofile"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$MACOS_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$MACOS_NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$api_key"
          printf '%s' "$MACOS_MAIN_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$main_profile"
          printf '%s' "$MACOS_FINDER_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$finder_profile"
          chmod 0600 "$certificate" "$api_key" "$main_profile" "$finder_profile"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          [[ $identity == "Developer ID Application:"*"(9PMA523YY4)" ]] || {
            echo "Expected Developer ID Application identity for Team 9PMA523YY4" >&2
            exit 1
          }
          xcrun notarytool store-credentials ZManagerCI --key "$api_key" \
            --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --keychain "$keychain" --validate
          {
            echo "ZMANAGER_CI_KEYCHAIN=$keychain"
            echo "ZMANAGER_CODESIGN_IDENTITY=$identity"
            echo "ZMANAGER_NOTARY_PROFILE=ZManagerCI"
            echo "ZMANAGER_MAIN_PROVISIONING_PROFILE=$main_profile"
            echo "ZMANAGER_FINDER_PROVISIONING_PROFILE=$finder_profile"
          } >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple, and inspect
        env:
          ZMANAGER_BUILD_NUMBER: ${{ env.ZMANAGER_RELEASE_BUILD_NUMBER }}
          ZMANAGER_MACOS_STAGE_DIR: /tmp/zmanager-macos-release
          ZMANAGER_RELEASE_SIGNED: ${{ steps.macos_signing.outputs.configured }}
        run: |
          set -euo pipefail
          if [[ "$ZMANAGER_RELEASE_SIGNED" == "true" ]]; then
            echo "Building the Developer ID signed and notarized macOS package."
          else
            echo "::warning::Building an ad-hoc-signed macOS testing package; it is not suitable for public Gatekeeper distribution."
            export ZMANAGER_CODESIGN_IDENTITY="-"
          fi
          scripts/build-macos.sh --skip-tests --no-install --arch "${{ matrix.arch }}" --bundle all
          version=$(node -p 'require("./package.json").version')
          app="/tmp/zmanager-macos-release/ZManager-${version}-macos-${{ matrix.arch }}.app"
          zip="/tmp/zmanager-macos-release/ZManager-${version}-macos-${{ matrix.arch }}.zip"
          dmg="/tmp/zmanager-macos-release/ZManager-${version}-macos-${{ matrix.arch }}.dmg"
          report="/tmp/zmanager-macos-release/ZManager-${version}-macos-${{ matrix.arch }}-inspection.json"
          gate_args=("$app" --expected-arch "${{ matrix.arch }}" --zip "$zip" --dmg "$dmg" --report "$report")
          if [[ "$ZMANAGER_RELEASE_SIGNED" == "true" ]]; then
            gate_args+=(--require-developer-id --require-notarization)
          fi
          scripts/release-gate-macos.sh "${gate_args[@]}"
          cd /tmp/zmanager-macos-release
          shasum -a 256 "ZManager-${version}-macos-${{ matrix.arch }}.zip" \
            "ZManager-${version}-macos-${{ matrix.arch }}.dmg" \
            > "ZManager-${version}-macos-${{ matrix.arch }}-SHA256SUMS.txt"

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            /tmp/zmanager-macos-release/*.zip
            /tmp/zmanager-macos-release/*.dmg
            /tmp/zmanager-macos-release/*-inspection.json
            /tmp/zmanager-macos-release/*-SHA256SUMS.txt

      - name: Remove release credentials
        if: always()
        run: |
          security delete-keychain "${ZMANAGER_CI_KEYCHAIN:-$RUNNER_TEMP/zmanager-release.keychain-db}" 2>/dev/null || true
          find "$RUNNER_TEMP" -maxdepth 1 -type f \( -name '*.p12' -o -name 'AuthKey_*.p8' -o -name '*.provisionprofile' \) -delete

  package-windows:
    name: Windows ${{ matrix.arch }} package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            artifact-name: zmanager-windows-x64
          - arch: arm64
            runner: windows-11-arm
            artifact-name: zmanager-windows-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Python
        if: matrix.arch == 'x64'
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Bind release version
        shell: bash
        run: |
          echo "ZMANAGER_RELEASE_BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Prepare and build Windows package
        shell: pwsh
        # The Windows build scripts redirect cargo output to a short CARGO_TARGET_DIR
        # (avoids MAX_PATH issues with deeply nested target paths); the upload paths
        # below must mirror this location.
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\zmbuild
          ZMANAGER_BUILD_NUMBER: ${{ env.ZMANAGER_RELEASE_BUILD_NUMBER }}
        run: |
          .\scripts\prepare-windows-static-build.ps1 `
            -Environment prod `
            -Architecture ${{ matrix.arch }} `
            -InstallMissing `
            -InstallNodeModules `
            -Build

      - name: Check staging E2E credentials
        id: staging_credentials
        shell: pwsh
        env:
          TZAP_DESKTOP_STAGING_CLIENT_ID: ${{ secrets.TZAP_DESKTOP_STAGING_CLIENT_ID }}
          TZAP_E2E_USERNAME: ${{ secrets.TZAP_E2E_USERNAME }}
          TZAP_E2E_PASSWORD: ${{ secrets.TZAP_E2E_PASSWORD }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:TZAP_DESKTOP_STAGING_CLIENT_ID)) { $missing += 'TZAP_DESKTOP_STAGING_CLIENT_ID' }
          if ([string]::IsNullOrWhiteSpace($env:TZAP_E2E_USERNAME)) { $missing += 'TZAP_E2E_USERNAME' }
          if ([string]::IsNullOrWhiteSpace($env:TZAP_E2E_PASSWORD)) { $missing += 'TZAP_E2E_PASSWORD' }
          if ($missing.Count -eq 0) {
            'configured=true' >> $env:GITHUB_OUTPUT
            Write-Host 'Staging Windows E2E credentials are configured.'
          } else {
            'configured=false' >> $env:GITHUB_OUTPUT
            Write-Warning "Skipping staging Windows E2E; missing repository secrets: $($missing -join ', ')."
          }

      - name: Smoke-test staging release artifact on Windows
        if: steps.staging_credentials.outputs.configured == 'true'
        shell: pwsh
        env:
          TZAP_DESKTOP_STAGING_CLIENT_ID: ${{ secrets.TZAP_DESKTOP_STAGING_CLIENT_ID }}
          TZAP_E2E_USERNAME: ${{ secrets.TZAP_E2E_USERNAME }}
          TZAP_E2E_PASSWORD: ${{ secrets.TZAP_E2E_PASSWORD }}
          TZAP_E2E_ENV: staging
          CARGO_TARGET_DIR: ${{ runner.temp }}\zmbuild-staging-e2e
          TZAP_E2E_ARTIFACT_DIR: ${{ runner.temp }}\zmanager-standalone-e2e-${{ github.run_id }}-${{ matrix.arch }}-release
        run: .\scripts\test-windows-standalone-staging.ps1 -Architecture ${{ matrix.arch }} -ReleaseArtifact

      - name: Upload staging standalone E2E evidence
        if: failure() && steps.staging_credentials.outputs.configured == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: zmanager-standalone-e2e-${{ matrix.arch }}
          if-no-files-found: warn
          path: ${{ runner.temp }}\zmanager-standalone-e2e-${{ github.run_id }}-${{ matrix.arch }}-*

      - name: Generate release third-party license bundle
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $stage = Join-Path $env:RUNNER_TEMP "zmanager-third-party-licenses"
          $archive = Join-Path $env:RUNNER_TEMP "zmanager-desktop-$version-third-party-licenses.zip"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          python scripts/generate-third-party-notices.py `
            --out-notices (Join-Path $stage "THIRD_PARTY_NOTICES.md") `
            --license-dir (Join-Path $stage "third-party-licenses") `
            --vcpkg-root "C:\vcpkg" `
            --vcpkg-triplet "x64-windows-static-md" `
            --check-npm
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $archive -Force
          Write-Host "Generated release license bundle: $archive"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}\zmbuild\*\release\zmanager-desktop.exe
            ${{ runner.temp }}\zmbuild\*\release\bundle\nsis\*.exe
            ${{ runner.temp }}\zmanager-desktop-*-third-party-licenses.zip

  package-deb:
    name: Linux DEB ${{ matrix.arch }} package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            artifact-name: zmanager-linux-x64-deb
          - arch: arm64
            runner: ubuntu-22.04-arm
            artifact-name: zmanager-linux-arm64-deb

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Bind release version
        run: |
          echo "ZMANAGER_RELEASE_BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build Debian package
        shell: bash
        env:
          ZMANAGER_BUILD_NUMBER: ${{ env.ZMANAGER_RELEASE_BUILD_NUMBER }}
        run: scripts/build-linux-ubuntu-deb.sh --install-deps --no-install

      - name: Upload Debian artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            /tmp/zmanager-desktop-deb/*.deb

  package-rpm:
    name: Linux RPM ${{ matrix.arch }} package
    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            artifact-name: zmanager-linux-x64-rpm
          - arch: arm64
            runner: ubuntu-22.04-arm
            artifact-name: zmanager-linux-arm64-rpm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Bind release version
        run: |
          echo "ZMANAGER_RELEASE_BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build RPM package
        shell: bash
        env:
          ZMANAGER_BUILD_NUMBER: ${{ env.ZMANAGER_RELEASE_BUILD_NUMBER }}
        run: scripts/build-linux-fedora-rpm.sh --install-deps --no-install

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            /tmp/zmanager-desktop-rpm/*.rpm


  publish:
    name: Publish release
    runs-on: ubuntu-24.04
    needs:
      - package-macos
      - package-windows
      - package-deb
      - package-rpm

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-artifacts

      - name: Prepare release bundle
        run: |
          set -euo pipefail

          mkdir -p release-bundles
          release_tag="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          release_version="${release_tag#v}"
          declare -A seen_names=()

          artifact_count=0
          while IFS= read -r -d '' src; do
            rel="${src#release-artifacts/}"
            artifact_dir="${rel%%/*}"
            file_path="${rel#*/}"
            file_name="$(basename "$file_path")"
            normalized_name=""

            case "$artifact_dir" in
              zmanager-windows-x64)
                arch="x64"
                if [[ "$file_name" == "zmanager-desktop-${release_version}-third-party-licenses.zip" ]]; then
                  normalized_name="$file_name"
                elif [[ "$src" == *"/bundle/nsis/"* ]] || [[ "$file_name" == *setup*.exe ]]; then
                  normalized_name="zmanager-desktop-${release_version}-windows-${arch}-installer.exe"
                elif [[ "$file_name" == "zmanager-desktop.exe" ]]; then
                  normalized_name="zmanager-desktop-${release_version}-windows-${arch}-portable.exe"
                else
                  echo "Skipping unknown windows artifact: $file_name" >&2
                  continue
                fi
                ;;
              zmanager-windows-arm64)
                arch="arm64"
                if [[ "$src" == *"/bundle/nsis/"* ]] || [[ "$file_name" == *setup*.exe ]]; then
                  normalized_name="zmanager-desktop-${release_version}-windows-${arch}-installer.exe"
                elif [[ "$file_name" == "zmanager-desktop.exe" ]]; then
                  normalized_name="zmanager-desktop-${release_version}-windows-${arch}-portable.exe"
                else
                  echo "Skipping unknown windows artifact: $file_name" >&2
                  continue
                fi
                ;;
              zmanager-linux-x64-deb)
                normalized_name="zmanager-desktop-${release_version}-linux-x64.deb"
                ;;
              zmanager-linux-arm64-deb)
                normalized_name="zmanager-desktop-${release_version}-linux-arm64.deb"
                ;;
              zmanager-linux-x64-rpm)
                normalized_name="zmanager-desktop-${release_version}-linux-x64.rpm"
                ;;
              zmanager-linux-arm64-rpm)
                normalized_name="zmanager-desktop-${release_version}-linux-arm64.rpm"
                ;;
              zmanager-macos-arm64|zmanager-macos-x86_64)
                case "$file_name" in
                  ZManager-${release_version}-macos-*.zip|ZManager-${release_version}-macos-*.dmg|ZManager-${release_version}-macos-*-inspection.json|ZManager-${release_version}-macos-*-SHA256SUMS.txt)
                    normalized_name="$file_name"
                    ;;
                  *)
                    echo "Skipping unknown macOS artifact: $file_name" >&2
                    continue
                    ;;
                esac
                ;;

              *)
                echo "Skipping unexpected artifact directory: $artifact_dir" >&2
                continue
                ;;
            esac

            if [[ -n "${seen_names[$normalized_name]:-}" ]]; then
              echo "Skipping duplicate artifact: $normalized_name" >&2
              continue
            fi

            cp "$src" "release-bundles/$normalized_name"
            seen_names["$normalized_name"]="1"
            artifact_count=$((artifact_count + 1))
          done < <(find release-artifacts -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.zip' -o -name '*.dmg' -o -name '*-inspection.json' -o -name '*-acceptance.json' -o -name '*-SHA256SUMS.txt' \) -print0)

          if [ "$artifact_count" -eq 0 ]; then
            echo "No packaged artifacts found" >&2
            exit 1
          fi

          required_macos_artifacts=(
            "ZManager-${release_version}-macos-arm64.zip"
            "ZManager-${release_version}-macos-arm64.dmg"
            "ZManager-${release_version}-macos-arm64-inspection.json"
            "ZManager-${release_version}-macos-arm64-SHA256SUMS.txt"
            "ZManager-${release_version}-macos-x86_64.zip"
            "ZManager-${release_version}-macos-x86_64.dmg"
            "ZManager-${release_version}-macos-x86_64-inspection.json"
            "ZManager-${release_version}-macos-x86_64-SHA256SUMS.txt"
          )
          for required in "${required_macos_artifacts[@]}"; do
            if [[ ! -f "release-bundles/$required" ]]; then
              echo "Required macOS release artifact is missing: $required" >&2
              exit 1
            fi
          done

          license_bundle="release-bundles/zmanager-desktop-${release_version}-third-party-licenses.zip"
          if [[ ! -f "$license_bundle" ]]; then
            echo "Required third-party license bundle is missing: $license_bundle" >&2
            exit 1
          fi

          sha256_file="release-bundles/zmanager-desktop-${release_version}-SHA256SUMS.txt"
          tmp_sha256="$(mktemp)"
          find release-bundles -type f -print0 \
            | xargs -0 sha256sum > "$tmp_sha256"
          mv "$tmp_sha256" "$sha256_file"

          echo "Prepared $artifact_count artifacts"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          name: zmanager-desktop ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          body: |
            Automated release of zmanager-desktop from GitHub Actions.

            - Built from pinned zmanager dependency tag.
            - Includes macOS arm64/x86_64 ZIP and DMG artifacts, Windows portable and installer binaries, and Linux DEB/RPM packages.
            - Includes a generated third-party license bundle with Rust, frontend, vendored, and Windows vcpkg notices.
            - macOS artifacts are Developer ID signed and notarized when release credentials are configured; otherwise they are ad-hoc-signed testing artifacts and are not suitable for public Gatekeeper distribution.
            - SHA256SUMS file is included for artifact verification.
          files: |
            release-bundles/*
          generate_release_notes: true
