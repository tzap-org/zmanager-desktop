name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish"
        required: true
      notarization_test:
        description: "Stage signed macOS packages for the notarization test without creating a release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ZMANAGER_BUILD_MODE: release
  ZMANAGER_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  ZMANAGER_NOTARIZATION_TEST: ${{ inputs.notarization_test }}

jobs:
  resolve-revision:
    name: Resolve desktop release revision
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && !inputs.notarization_test && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - name: Record the checked-out commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  security:
    needs: resolve-revision
    permissions:
      contents: read
    uses: ./.github/workflows/security-audit.yml
    with:
      checkout_ref: ${{ needs.resolve-revision.outputs.sha }}

  package-macos:
    needs: [resolve-revision, security]
    name: macOS ${{ matrix.arch }} ${{ matrix.profile }} package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
        profile: [local, online]
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-revision.outputs.sha }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Bind release version
        run: |
          echo "ZMANAGER_RELEASE_BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Install build and test dependencies
        run: |
          brew install cmake lz4 xz ripgrep
          rustup target add "${{ matrix.arch == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}"
          npm ci
          npx playwright install --with-deps chromium
          scripts/ensure-sibling-repos.sh --mode release
          scripts/sync-uniffi-swift-bindings.sh
          source scripts/pinned-openssl.sh
          zmanager_configure_pinned_openssl "${{ matrix.arch == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}"

      - name: Run release verification tests
        if: matrix.profile == 'local'
        env:
          ZMANAGER_TZAP_BUILD_ENV: staging
          ZMANAGER_TZAP_SERVER_BASE_URL: https://staging.tzap.org
        run: |
          npm run test:frontend
          npm run test:architecture
          VITE_TZAP_BUILD_ENV=staging npm run test:e2e
          (cd src-tauri && cargo fmt --check)
          (cd src-tauri && cargo clippy --all-targets --all-features -- -D warnings)
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path crates/zmanager-shell-contract/Cargo.toml
          swift test --package-path native/macos

      - name: Import Developer ID certificate
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MACOS_DEVELOPER_ID_P12_BASE64:?missing Developer ID certificate}"
          : "${MACOS_DEVELOPER_ID_P12_PASSWORD:?missing certificate password}"
          keychain="$RUNNER_TEMP/zmanager-release.keychain-db"
          certificate="$RUNNER_TEMP/zmanager-developer-id.p12"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$MACOS_DEVELOPER_ID_P12_BASE64" | base64 -D > "$certificate"
          chmod 0600 "$certificate"
          trap 'rm -f "$certificate"' EXIT
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p')
          [[ $identity == "Developer ID Application:"* && $identity != *$'\n'* ]] || {
            echo "The configured certificate must contain exactly one Developer ID Application identity." >&2
            exit 1
          }
          team_id=$(sed -n 's/.*(\([A-Z0-9][A-Z0-9]*\))$/\1/p' <<< "$identity")
          [[ -n $team_id ]] || {
            echo "The configured Developer ID identity does not include a Team ID." >&2
            exit 1
          }
          {
            echo "ZMANAGER_CI_KEYCHAIN=$keychain"
            echo "ZMANAGER_CODESIGN_IDENTITY=$identity"
            echo "ZMANAGER_TEAM_ID=$team_id"
          } >> "$GITHUB_ENV"

      - name: Build and verify signed notarization inputs
        env:
          ZMANAGER_BUILD_NUMBER: ${{ env.ZMANAGER_RELEASE_BUILD_NUMBER }}
          ZMANAGER_MACOS_STAGE_DIR: ${{ runner.temp }}/zmanager-macos-release
          CARGO_TARGET_DIR: ${{ runner.temp }}/zmbuild-${{ matrix.profile }}
          ZMANAGER_TZAP_BUILD_ENV: ${{ inputs.notarization_test && 'staging' || 'prod' }}
          ZMANAGER_TZAP_SERVER_BASE_URL: ${{ inputs.notarization_test && 'https://staging.tzap.org' || '' }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          scripts/build-macos.sh --skip-tests --no-install --arch "$TARGET_ARCH" --profile "$TARGET_PROFILE" --bundle all
          version=$(node -p 'require("./package.json").version')
          product="ZManager"
          if [[ "$TARGET_PROFILE" == "online" ]]; then product="ZManager-full"; fi
          base="$ZMANAGER_MACOS_STAGE_DIR/$product-$version-macos-$TARGET_ARCH"
          scripts/release-gate-macos.sh "$base.app" --expected-arch "$TARGET_ARCH" \
            --zip "$base.zip" --dmg "$base.dmg" --require-developer-id
          codesign --verify --strict "$base.dmg"

      - name: Upload signed macOS inputs
        id: signed-inputs
        uses: actions/upload-artifact@v6
        with:
          name: zmanager-macos-${{ matrix.arch }}-${{ matrix.profile }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          path: |
            ${{ runner.temp }}/zmanager-macos-release/*.zip
            ${{ runner.temp }}/zmanager-macos-release/*.dmg

      - name: Record signed inputs
        env:
          SIGNED_ARTIFACT_ID: ${{ steps.signed-inputs.outputs.artifact-id }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_PROFILE: ${{ matrix.profile }}
        run: |
          python3 scripts/desktop-notarization.py record "$RUNNER_TEMP/zmanager-macos-release" \
            "$RUNNER_TEMP/notarization-$TARGET_ARCH-$TARGET_PROFILE.json"

      - name: Upload notarization record
        uses: actions/upload-artifact@v6
        with:
          name: zmanager-notary-record-${{ matrix.arch }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/notarization-*.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Upload sibling build provenance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-build-inputs-macos-${{ matrix.arch }}-${{ matrix.profile }}
          path: target/build-inputs-report.tsv
          if-no-files-found: warn

      - name: Remove release credentials
        if: always()
        run: |
          security delete-keychain "${ZMANAGER_CI_KEYCHAIN:-$RUNNER_TEMP/zmanager-release.keychain-db}" 2>/dev/null || true
          find "$RUNNER_TEMP" -maxdepth 1 -type f \( -name '*.p12' -o -name 'AuthKey_*.p8' -o -name '*.provisionprofile' \) -delete

  package-windows:
    needs: [resolve-revision, security]
    if: github.event_name != 'workflow_dispatch' || !inputs.notarization_test
    name: Windows ${{ matrix.arch }} ${{ matrix.profile }} package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        profile: [local, online]
        include:
          - arch: x64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-revision.outputs.sha }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Python
        if: matrix.arch == 'x64'
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Bind release version
        shell: bash
        run: |
          echo "ZMANAGER_RELEASE_BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Prepare and build Windows package
        shell: pwsh
        # The Windows build scripts redirect cargo output to a short CARGO_TARGET_DIR
        # (avoids MAX_PATH issues with deeply nested target paths); the upload paths
        # below must mirror this location.
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\zmbuild-${{ matrix.profile }}
          ZMANAGER_BUILD_NUMBER: ${{ env.ZMANAGER_RELEASE_BUILD_NUMBER }}
          MS_STORE_PACKAGE_NAME: ${{ vars.MS_STORE_PACKAGE_NAME }}
          MS_STORE_PUBLISHER: ${{ vars.MS_STORE_PUBLISHER }}
          MS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          $buildArgs = @{
            Environment = 'prod'
            Profile = '${{ matrix.profile }}'
            Architecture = '${{ matrix.arch }}'
            InstallMissing = $true
            InstallNodeModules = $true
            Build = $true
          }
          if ('${{ matrix.profile }}' -eq 'local' -and
              -not [string]::IsNullOrWhiteSpace($env:MS_STORE_PACKAGE_NAME) -and
              -not [string]::IsNullOrWhiteSpace($env:MS_STORE_PUBLISHER) -and
              -not [string]::IsNullOrWhiteSpace($env:MS_STORE_PUBLISHER_DISPLAY_NAME)) {
            $buildArgs.BuildStoreMsix = $true
            $buildArgs.StorePackageName = $env:MS_STORE_PACKAGE_NAME
            $buildArgs.StorePublisher = $env:MS_STORE_PUBLISHER
            $buildArgs.StorePublisherDisplayName = $env:MS_STORE_PUBLISHER_DISPLAY_NAME
          }
          .\scripts\prepare-windows-static-build.ps1 @buildArgs

      - name: Check staging E2E credentials
        id: staging_credentials
        shell: pwsh
        env:
          TZAP_DESKTOP_STAGING_CLIENT_ID: ${{ secrets.TZAP_DESKTOP_STAGING_CLIENT_ID }}
          TZAP_E2E_USERNAME: ${{ secrets.TZAP_E2E_USERNAME }}
          TZAP_E2E_PASSWORD: ${{ secrets.TZAP_E2E_PASSWORD }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:TZAP_DESKTOP_STAGING_CLIENT_ID)) { $missing += 'TZAP_DESKTOP_STAGING_CLIENT_ID' }
          if ([string]::IsNullOrWhiteSpace($env:TZAP_E2E_USERNAME)) { $missing += 'TZAP_E2E_USERNAME' }
          if ([string]::IsNullOrWhiteSpace($env:TZAP_E2E_PASSWORD)) { $missing += 'TZAP_E2E_PASSWORD' }
          if ($missing.Count -eq 0) {
            'configured=true' >> $env:GITHUB_OUTPUT
            Write-Host 'Staging Windows E2E credentials are configured.'
          } else {
            'configured=false' >> $env:GITHUB_OUTPUT
            Write-Warning "Skipping staging Windows E2E; missing repository secrets: $($missing -join ', ')."
          }

      - name: Smoke-test online profile on staging (CI only)
        # The ARM64 hosted runner does not provide the browser/default-browser
        # integration required by the hosted-account handoff test.
        if: matrix.arch == 'x64' && matrix.profile == 'online' && steps.staging_credentials.outputs.configured == 'true'
        shell: pwsh
        env:
          TZAP_DESKTOP_STAGING_CLIENT_ID: ${{ secrets.TZAP_DESKTOP_STAGING_CLIENT_ID }}
          TZAP_E2E_USERNAME: ${{ secrets.TZAP_E2E_USERNAME }}
          TZAP_E2E_PASSWORD: ${{ secrets.TZAP_E2E_PASSWORD }}
          TZAP_E2E_ENV: staging
          CARGO_TARGET_DIR: ${{ runner.temp }}\zmbuild-staging-e2e
          TZAP_E2E_ARTIFACT_DIR: ${{ runner.temp }}\zmanager-standalone-e2e-${{ github.run_id }}-${{ matrix.arch }}-release
        run: .\scripts\test-windows-standalone-staging.ps1 -Architecture ${{ matrix.arch }} -ReleaseArtifact

      - name: Upload staging standalone E2E evidence
        if: failure() && matrix.arch == 'x64' && matrix.profile == 'online' && steps.staging_credentials.outputs.configured == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: zmanager-standalone-e2e-${{ matrix.arch }}
          if-no-files-found: warn
          path: ${{ runner.temp }}\zmanager-standalone-e2e-${{ github.run_id }}-${{ matrix.arch }}-*

      - name: Generate release third-party license bundle
        if: matrix.arch == 'x64' && matrix.profile == 'local'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $stage = Join-Path $env:RUNNER_TEMP "zmanager-third-party-licenses"
          $archive = Join-Path $env:RUNNER_TEMP "zmanager-desktop-$version-third-party-licenses.zip"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          python scripts/generate-third-party-notices.py `
            --out-notices (Join-Path $stage "THIRD_PARTY_NOTICES.md") `
            --license-dir (Join-Path $stage "third-party-licenses") `
            --vcpkg-root "C:\vcpkg" `
            --vcpkg-triplet "x64-windows-static-md" `
            --check-npm
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $archive -Force
          Write-Host "Generated release license bundle: $archive"

      - name: Upload Microsoft Store MSIX package
        if: matrix.profile == 'local' && vars.MS_STORE_PACKAGE_NAME != '' && vars.MS_STORE_PUBLISHER != '' && vars.MS_STORE_PUBLISHER_DISPLAY_NAME != ''
        uses: actions/upload-artifact@v6
        with:
          name: zmanager-windows-msix-${{ matrix.arch }}
          if-no-files-found: error
          path: target/msix/${{ matrix.arch }}/*.msix

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: zmanager-windows-${{ matrix.arch }}-${{ matrix.profile == 'online' && 'full' || 'local' }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}\zmbuild-${{ matrix.profile }}\*\release\zmanager-desktop.exe
            ${{ runner.temp }}\zmbuild-${{ matrix.profile }}\*\release\bundle\nsis\*.exe
            ${{ runner.temp }}\zmanager-desktop-*-third-party-licenses.zip

      - name: Upload sibling build provenance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-build-inputs-windows-${{ matrix.arch }}-${{ matrix.profile }}
          path: target/build-inputs-report.tsv
          if-no-files-found: warn

  package-deb:
    needs: [resolve-revision, security]
    if: github.event_name != 'workflow_dispatch' || !inputs.notarization_test
    name: Linux DEB ${{ matrix.arch }} ${{ matrix.profile }} package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        profile: [local, online]
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-revision.outputs.sha }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Bind release version
        run: |
          echo "ZMANAGER_RELEASE_BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build Debian package
        shell: bash
        env:
          ZMANAGER_BUILD_NUMBER: ${{ env.ZMANAGER_RELEASE_BUILD_NUMBER }}
          ZMANAGER_TZAP_BUILD_ENV: prod
          CARGO_TARGET_DIR: ${{ runner.temp }}/zmbuild-${{ matrix.profile }}
          ZMANAGER_DEB_STAGE_DIR: /tmp/zmanager-desktop-deb-${{ matrix.profile }}
        run: |
          args=(--install-deps --no-install --profile "${{ matrix.profile }}")
          if [[ "${{ matrix.profile }}" == online ]]; then args+=(--skip-tests); fi
          scripts/build-linux-ubuntu-deb.sh "${args[@]}"

      - name: Upload Debian artifacts
        uses: actions/upload-artifact@v6
        with:
          name: zmanager-linux-${{ matrix.arch }}-deb-${{ matrix.profile == 'online' && 'full' || 'local' }}
          if-no-files-found: error
          path: |
            /tmp/zmanager-desktop-deb-${{ matrix.profile }}/*.deb

      - name: Upload sibling build provenance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-build-inputs-deb-${{ matrix.arch }}-${{ matrix.profile }}
          path: target/build-inputs-report.tsv
          if-no-files-found: warn

  package-rpm:
    needs: [resolve-revision, security]
    if: github.event_name != 'workflow_dispatch' || !inputs.notarization_test
    name: Linux RPM ${{ matrix.arch }} ${{ matrix.profile }} package
    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        profile: [local, online]
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-revision.outputs.sha }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Bind release version
        run: |
          echo "ZMANAGER_RELEASE_BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build RPM package
        shell: bash
        env:
          ZMANAGER_BUILD_NUMBER: ${{ env.ZMANAGER_RELEASE_BUILD_NUMBER }}
          ZMANAGER_TZAP_BUILD_ENV: prod
          CARGO_TARGET_DIR: /tmp/zmbuild-${{ matrix.profile }}
          ZMANAGER_RPM_STAGE_DIR: /tmp/zmanager-desktop-rpm-${{ matrix.profile }}
        run: |
          args=(--install-deps --no-install --profile "${{ matrix.profile }}")
          if [[ "${{ matrix.profile }}" == online ]]; then args+=(--skip-tests); fi
          scripts/build-linux-fedora-rpm.sh "${args[@]}"

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v6
        with:
          name: zmanager-linux-${{ matrix.arch }}-rpm-${{ matrix.profile == 'online' && 'full' || 'local' }}
          if-no-files-found: error
          path: |
            /tmp/zmanager-desktop-rpm-${{ matrix.profile }}/*.rpm

      - name: Upload sibling build provenance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-build-inputs-rpm-${{ matrix.arch }}-${{ matrix.profile }}
          path: target/build-inputs-report.tsv
          if-no-files-found: warn


  notarization-test-inputs:
    name: Record notarization test inputs
    needs: [resolve-revision, package-macos]
    if: inputs.notarization_test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-revision.outputs.sha }}
      - uses: actions/download-artifact@v6
        with:
          pattern: zmanager-notary-record-*
          merge-multiple: true
          path: notary-records
      - name: Prepare test manifest
        run: python3 scripts/desktop-notarization.py manifest notary-records desktop-notarization.json --test
      - uses: actions/upload-artifact@v6
        with:
          name: zmanager-notary-test
          path: desktop-notarization.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Show how to resume
        run: echo "Run Desktop Notarization with test_run_id=$GITHUB_RUN_ID to submit or resume these signed packages." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Stage draft GitHub release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs:
      - resolve-revision
      - package-macos
      - package-windows
      - package-deb
      - package-rpm
    if: github.event_name != 'workflow_dispatch' || !inputs.notarization_test

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-revision.outputs.sha }}
      - name: Download notarization records
        uses: actions/download-artifact@v6
        with:
          pattern: zmanager-notary-record-*
          merge-multiple: true
          path: notary-records
      - name: Download Windows and Linux release artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: zmanager-{windows,linux}-*
          path: release-artifacts

      - name: Prepare release bundle
        run: |
          set -euo pipefail

          mkdir -p release-bundles
          release_tag="$ZMANAGER_RELEASE_TAG"
          release_version="${release_tag#v}"
          declare -A seen_names=()

          artifact_count=0
          while IFS= read -r -d '' src; do
            rel="${src#release-artifacts/}"
            artifact_dir="${rel%%/*}"
            file_path="${rel#*/}"
            file_name="$(basename "$file_path")"
            normalized_name=""

            case "$artifact_dir" in
              zmanager-windows-x64-local|zmanager-windows-x64-full)
                arch="x64"
                variant=""
                if [[ "$artifact_dir" == *-full ]]; then variant="full-"; fi
                if [[ "$file_name" == "zmanager-desktop-${release_version}-third-party-licenses.zip" ]]; then
                  normalized_name="$file_name"
                elif [[ "$src" == *"/bundle/nsis/"* ]] || [[ "$file_name" == *setup*.exe ]]; then
                  normalized_name="zmanager-desktop-${variant}${release_version}-windows-${arch}-installer.exe"
                elif [[ "$file_name" == "zmanager-desktop.exe" ]]; then
                  normalized_name="zmanager-desktop-${variant}${release_version}-windows-${arch}-portable.exe"
                else
                  echo "Skipping unknown windows artifact: $file_name" >&2
                  continue
                fi
                ;;
              zmanager-windows-arm64-local|zmanager-windows-arm64-full)
                arch="arm64"
                variant=""
                if [[ "$artifact_dir" == *-full ]]; then variant="full-"; fi
                if [[ "$src" == *"/bundle/nsis/"* ]] || [[ "$file_name" == *setup*.exe ]]; then
                  normalized_name="zmanager-desktop-${variant}${release_version}-windows-${arch}-installer.exe"
                elif [[ "$file_name" == "zmanager-desktop.exe" ]]; then
                  normalized_name="zmanager-desktop-${variant}${release_version}-windows-${arch}-portable.exe"
                else
                  echo "Skipping unknown windows artifact: $file_name" >&2
                  continue
                fi
                ;;
              zmanager-windows-msix-x64)
                normalized_name="$file_name"
                ;;
              zmanager-windows-msix-arm64)
                normalized_name="$file_name"
                ;;
              zmanager-linux-x64-deb-local|zmanager-linux-x64-deb-full)
                variant=""
                if [[ "$artifact_dir" == *-full ]]; then variant="full-"; fi
                normalized_name="zmanager-desktop-${variant}${release_version}-linux-x64.deb"
                ;;
              zmanager-linux-arm64-deb-local|zmanager-linux-arm64-deb-full)
                variant=""
                if [[ "$artifact_dir" == *-full ]]; then variant="full-"; fi
                normalized_name="zmanager-desktop-${variant}${release_version}-linux-arm64.deb"
                ;;
              zmanager-linux-x64-rpm-local|zmanager-linux-x64-rpm-full)
                variant=""
                if [[ "$artifact_dir" == *-full ]]; then variant="full-"; fi
                normalized_name="zmanager-desktop-${variant}${release_version}-linux-x64.rpm"
                ;;
              zmanager-linux-arm64-rpm-local|zmanager-linux-arm64-rpm-full)
                variant=""
                if [[ "$artifact_dir" == *-full ]]; then variant="full-"; fi
                normalized_name="zmanager-desktop-${variant}${release_version}-linux-arm64.rpm"
                ;;
              *)
                echo "Skipping unexpected artifact directory: $artifact_dir" >&2
                continue
                ;;
            esac

            if [[ -n "${seen_names[$normalized_name]:-}" ]]; then
              echo "Skipping duplicate artifact: $normalized_name" >&2
              continue
            fi

            cp "$src" "release-bundles/$normalized_name"
            seen_names["$normalized_name"]="1"
            artifact_count=$((artifact_count + 1))
          done < <(find release-artifacts -type f \( -name '*.exe' -o -name '*.msix' -o -name '*.deb' -o -name '*.rpm' -o -name '*.zip' -o -name '*.dmg' -o -name '*-inspection.json' -o -name '*-acceptance.json' -o -name '*-SHA256SUMS.txt' \) -print0)

          if [ "$artifact_count" -eq 0 ]; then
            echo "No packaged artifacts found" >&2
            exit 1
          fi

          license_bundle="release-bundles/zmanager-desktop-${release_version}-third-party-licenses.zip"
          if [[ ! -f "$license_bundle" ]]; then
            echo "Required third-party license bundle is missing: $license_bundle" >&2
            exit 1
          fi

          required_platform_artifacts=(
            "zmanager-desktop-${release_version}-windows-x64-installer.exe"
            "zmanager-desktop-${release_version}-windows-x64-portable.exe"
            "zmanager-desktop-full-${release_version}-windows-x64-installer.exe"
            "zmanager-desktop-full-${release_version}-windows-x64-portable.exe"
            "zmanager-desktop-${release_version}-windows-arm64-installer.exe"
            "zmanager-desktop-${release_version}-windows-arm64-portable.exe"
            "zmanager-desktop-full-${release_version}-windows-arm64-installer.exe"
            "zmanager-desktop-full-${release_version}-windows-arm64-portable.exe"
            "zmanager-desktop-${release_version}-linux-x64.deb"
            "zmanager-desktop-full-${release_version}-linux-x64.deb"
            "zmanager-desktop-${release_version}-linux-arm64.deb"
            "zmanager-desktop-full-${release_version}-linux-arm64.deb"
            "zmanager-desktop-${release_version}-linux-x64.rpm"
            "zmanager-desktop-full-${release_version}-linux-x64.rpm"
            "zmanager-desktop-${release_version}-linux-arm64.rpm"
            "zmanager-desktop-full-${release_version}-linux-arm64.rpm"
          )
          for required in "${required_platform_artifacts[@]}"; do
            if [[ ! -f "release-bundles/$required" ]]; then
              echo "Required release artifact is missing: $required" >&2
              exit 1
            fi
          done

          echo "Prepared $artifact_count Windows and Linux artifacts"

      - name: Create draft for the notarization finalizer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/desktop-notarization.py stage notary-records release-bundles
