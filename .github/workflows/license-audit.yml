name: License Audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZMANAGER_BUILD_MODE: snapshot
  ZMANAGER_BUILD_INPUTS_LOCK: .build-inputs/ci-sibling-inputs.lock

jobs:
  licenses:
    name: Third-party license gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve sibling branch snapshot
        run: bash scripts/prepare-sibling-inputs.sh --lockfile release-build-inputs.lock --resolve-ci .build-inputs/ci-sibling-inputs.lock

      - name: Prepare frozen sibling inputs
        run: bash scripts/prepare-sibling-inputs.sh --mode snapshot --lockfile "$ZMANAGER_BUILD_INPUTS_LOCK"

      - name: Ensure Cargo path dependencies
        run: scripts/ensure-sibling-repos.sh

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check Rust dependency licenses
        working-directory: src-tauri
        # zmanager-unrar carries its custom terms via license-file; suppress
        # cargo-deny's generic missing SPDX-field warning for file-only licenses.
        run: cargo deny --all-features check licenses --allow no-license-field

      - name: Generate and validate the release license bundle
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/zmanager-third-party-licenses"
          python3 scripts/generate-third-party-notices.py \
            --out-notices "$stage/THIRD_PARTY_NOTICES.md" \
            --license-dir "$stage/third-party-licenses" \
            --check-npm
          test -s "$stage/THIRD_PARTY_NOTICES.md"
          test -d "$stage/third-party-licenses"
