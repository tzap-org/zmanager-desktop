name: Bump Product Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New SemVer release version (for example 1.1.2)"
        required: true
        type: string

permissions:
  contents: write

env:
  ZMANAGER_BUILD_MODE: snapshot
  ZMANAGER_BUILD_INPUTS_LOCK: .build-inputs/ci-sibling-inputs.lock

jobs:
  bump-version:
    name: Bump Version to ${{ inputs.version }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve sibling branch snapshot
        run: bash scripts/prepare-sibling-inputs.sh --lockfile release-build-inputs.lock --resolve-ci .build-inputs/ci-sibling-inputs.lock

      - name: Prepare frozen sibling inputs
        run: bash scripts/prepare-sibling-inputs.sh --mode snapshot --lockfile "$ZMANAGER_BUILD_INPUTS_LOCK"

      - name: Run version bump script
        run: bash scripts/bump-version.sh "${{ inputs.version }}"

      - name: Verify product and frontend
        run: npm run build

      - name: Commit and push version bump
        run: |
          version="${{ inputs.version }}"
          version="${version#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: bump version to v${version}"
          git push
