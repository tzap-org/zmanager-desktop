name: Package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.flavor }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: macos
            arch: arm64
            runner: macos-15
          - flavor: macos
            arch: x86_64
            runner: macos-15-intel
          - flavor: windows
            arch: x64
            runner: windows-2022
          - flavor: windows
            arch: arm64
            runner: windows-11-arm
          - flavor: linux-deb
            arch: x64
            runner: ubuntu-22.04
          - flavor: linux-deb
            arch: arm64
            runner: ubuntu-22.04-arm
          - flavor: linux-rpm
            arch: x64
            runner: ubuntu-22.04
            container: fedora:latest
          - flavor: linux-rpm
            arch: arm64
            runner: ubuntu-22.04-arm
            container: fedora:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check staging E2E credentials
        if: matrix.flavor == 'macos' || matrix.flavor == 'windows' || matrix.flavor == 'linux-deb'
        id: staging_credentials
        env:
          TZAP_DESKTOP_STAGING_CLIENT_ID: ${{ secrets.TZAP_DESKTOP_STAGING_CLIENT_ID }}
          TZAP_E2E_USERNAME: ${{ secrets.TZAP_E2E_USERNAME }}
          TZAP_E2E_PASSWORD: ${{ secrets.TZAP_E2E_PASSWORD }}
        run: node scripts/check-staging-e2e-credentials.mjs

      # ---- macOS ----
      - name: Install Rust target and frontend dependencies (macOS)
        if: matrix.flavor == 'macos'
        run: |
          brew install cmake lz4 xz ripgrep
          rustup target add "${{ matrix.arch == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}"
          npm ci
          npx playwright install --with-deps chromium
          scripts/ensure-sibling-repos.sh
          scripts/sync-uniffi-swift-bindings.sh

      - name: Run macOS migration, E2E visual scans, and contract tests
        if: matrix.flavor == 'macos'
        run: |
          npm run test:frontend
          npm run test:architecture
          npm run test:e2e
          (cd src-tauri && cargo fmt --check)
          (cd src-tauri && cargo clippy --all-targets --all-features -- -D warnings)
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path crates/zmanager-shell-contract/Cargo.toml
          swift test --package-path native/macos

      - name: Upload Playwright test results on failure
        if: failure() && matrix.flavor == 'macos'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results-macos-${{ matrix.arch }}
          path: |
            test-results/
            docs/gui-audit/

      - name: Run native macOS GUI tests
        if: matrix.flavor == 'macos' && steps.staging_credentials.outputs.configured == 'true'
        env:
          TZAP_DESKTOP_STAGING_CLIENT_ID: ${{ secrets.TZAP_DESKTOP_STAGING_CLIENT_ID }}
          TZAP_E2E_USERNAME: ${{ secrets.TZAP_E2E_USERNAME }}
          TZAP_E2E_PASSWORD: ${{ secrets.TZAP_E2E_PASSWORD }}
          TZAP_E2E_ENV: staging
          TZAP_E2E_STAGING_CALLBACK_ADAPTER: '1'
        run: npm run test:gui:macos

      # ---- Windows ----
      - name: Prepare Windows build environment
        if: matrix.flavor == 'windows'
        shell: pwsh
        env:
          TZAP_DESKTOP_STAGING_CLIENT_ID: ${{ secrets.TZAP_DESKTOP_STAGING_CLIENT_ID }}
        run: |
          .\scripts\prepare-windows-static-build.ps1 `
            -Environment staging `
            -Architecture ${{ matrix.arch }} `
            -InstallMissing `
            -InstallNodeModules

      - name: Ensure sibling repositories
        if: matrix.flavor == 'windows'
        shell: pwsh
        run: .\scripts\ensure-sibling-repos.ps1

      - name: Run staging Windows standalone E2E
        if: matrix.flavor == 'windows' && steps.staging_credentials.outputs.configured == 'true'
        shell: pwsh
        env:
          TZAP_DESKTOP_STAGING_CLIENT_ID: ${{ secrets.TZAP_DESKTOP_STAGING_CLIENT_ID }}
          TZAP_E2E_USERNAME: ${{ secrets.TZAP_E2E_USERNAME }}
          TZAP_E2E_PASSWORD: ${{ secrets.TZAP_E2E_PASSWORD }}
          TZAP_E2E_ENV: staging
          TZAP_E2E_STAGING_CALLBACK_ADAPTER: '1'
          TZAP_E2E_ARTIFACT_DIR: ${{ runner.temp }}\zmanager-standalone-e2e-${{ github.run_id }}-${{ matrix.arch }}-debug
        run: .\scripts\test-windows-standalone-staging.ps1 -Architecture ${{ matrix.arch }}

      - name: Upload staging standalone E2E evidence
        if: failure() && matrix.flavor == 'windows' && steps.staging_credentials.outputs.configured == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: zmanager-standalone-e2e-${{ matrix.arch }}
          if-no-files-found: warn
          path: ${{ runner.temp }}\zmanager-standalone-e2e-${{ github.run_id }}-${{ matrix.arch }}-*

      - name: Run staging Windows release-artifact smoke
        if: matrix.flavor == 'windows' && steps.staging_credentials.outputs.configured == 'true'
        shell: pwsh
        env:
          TZAP_DESKTOP_STAGING_CLIENT_ID: ${{ secrets.TZAP_DESKTOP_STAGING_CLIENT_ID }}
          TZAP_E2E_USERNAME: ${{ secrets.TZAP_E2E_USERNAME }}
          TZAP_E2E_PASSWORD: ${{ secrets.TZAP_E2E_PASSWORD }}
          TZAP_E2E_ENV: staging
          TZAP_E2E_ARTIFACT_DIR: ${{ runner.temp }}\zmanager-standalone-e2e-${{ github.run_id }}-${{ matrix.arch }}-release
        run: .\scripts\test-windows-standalone-staging.ps1 -Architecture ${{ matrix.arch }} -ReleaseArtifact

      - name: Upload staging release-artifact E2E evidence
        if: failure() && matrix.flavor == 'windows' && steps.staging_credentials.outputs.configured == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: zmanager-standalone-release-e2e-${{ matrix.arch }}
          if-no-files-found: warn
          path: ${{ runner.temp }}\zmanager-standalone-e2e-${{ github.run_id }}-${{ matrix.arch }}-release

      # ---- Linux DEB (Ubuntu) ----
      - name: Install Ubuntu build dependencies
        if: matrix.flavor == 'linux-deb'
        shell: bash
        run: scripts/build-linux-ubuntu-deb.sh --install-deps --deps-only

      - name: Run Ubuntu frontend and Rust tests
        if: matrix.flavor == 'linux-deb'
        shell: bash
        run: |
          npm run test:frontend
          (cd src-tauri && cargo fmt --check)
          (cd src-tauri && cargo clippy --all-targets --all-features -- -D warnings)
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run native Linux GUI tests
        if: matrix.flavor == 'linux-deb' && steps.staging_credentials.outputs.configured == 'true'
        shell: bash
        env:
          TZAP_DESKTOP_STAGING_CLIENT_ID: ${{ secrets.TZAP_DESKTOP_STAGING_CLIENT_ID }}
          TZAP_E2E_USERNAME: ${{ secrets.TZAP_E2E_USERNAME }}
          TZAP_E2E_PASSWORD: ${{ secrets.TZAP_E2E_PASSWORD }}
          TZAP_E2E_ENV: staging
          TZAP_E2E_STAGING_CALLBACK_ADAPTER: '1'
        run: |
          # openbox: without a window manager the X server has no EWMH support,
          # so GTK window-state calls (minimize, maximize) silently do nothing.
          sudo apt-get install -y xvfb openbox x11-utils
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          timeout 30 bash -c 'until xdpyinfo -display :99 >/dev/null 2>&1; do sleep 1; done'
          openbox &
          npm run test:gui:linux

      - name: Upload Linux GUI diagnostics
        if: always() && matrix.flavor == 'linux-deb'
        uses: actions/upload-artifact@v6
        with:
          name: zmanager-linux-gui-diagnostics-${{ matrix.arch }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/debug/logs/
            logs/
            test-results/

      # ---- Linux RPM (Fedora) ----
      - name: Install Fedora prerequisites
        if: matrix.flavor == 'linux-rpm'
        shell: bash
        run: |
          dnf install -y python3 git ripgrep ca-certificates
          npm ci
          scripts/ensure-sibling-repos.sh

      - name: Run Fedora packaging and architecture tests
        if: matrix.flavor == 'linux-rpm'
        shell: bash
        run: |
          scripts/test-linux-packaging-scripts.sh
          npm run test:architecture

  package:
    name: Package ${{ matrix.flavor }} ${{ matrix.arch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: macos
            arch: arm64
            runner: macos-15
            artifact-name: zmanager-macos-arm64-ci
          - flavor: macos
            arch: x86_64
            runner: macos-15-intel
            artifact-name: zmanager-macos-x86_64-ci
          - flavor: windows
            arch: x64
            runner: windows-2022
            artifact-name: zmanager-windows-x64
          - flavor: windows
            arch: arm64
            runner: windows-11-arm
            artifact-name: zmanager-windows-arm64
          - flavor: linux-deb
            arch: x64
            runner: ubuntu-22.04
            artifact-name: zmanager-linux-x64-deb
          - flavor: linux-deb
            arch: arm64
            runner: ubuntu-22.04-arm
            artifact-name: zmanager-linux-arm64-deb
          - flavor: linux-rpm
            arch: x64
            runner: ubuntu-22.04
            container: fedora:latest
            artifact-name: zmanager-linux-x64-rpm
          - flavor: linux-rpm
            arch: arm64
            runner: ubuntu-22.04-arm
            container: fedora:latest
            artifact-name: zmanager-linux-arm64-rpm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      # ---- macOS ----
      - name: Install Rust target and frontend dependencies (macOS)
        if: matrix.flavor == 'macos'
        run: |
          brew install cmake lz4 xz ripgrep
          rustup target add "${{ matrix.arch == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}"
          npm ci
          scripts/ensure-sibling-repos.sh
          scripts/sync-uniffi-swift-bindings.sh

      - name: Build and inspect ad-hoc release bundle
        if: matrix.flavor == 'macos'
        env:
          ZMANAGER_BUILD_NUMBER: ${{ github.run_number }}
          ZMANAGER_MACOS_STAGE_DIR: /tmp/zmanager-macos-ci
        run: |
          scripts/build-macos.sh --skip-tests --no-install --arch "${{ matrix.arch }}" --bundle all
          app="/tmp/zmanager-macos-ci/ZManager-$(node -p 'require("./package.json").version')-macos-${{ matrix.arch }}.app"
          scripts/release-gate-macos.sh "$app" --expected-arch "${{ matrix.arch }}" \
            --report "/tmp/zmanager-macos-ci/inspection-${{ matrix.arch }}.json"
          scripts/test-macos-register-bundle.sh "$app"
          scripts/test-release-gate-macos.sh "$app" "${{ matrix.arch }}"

      - name: Upload macOS inspection and test artifact
        if: matrix.flavor == 'macos'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            /tmp/zmanager-macos-ci/*.app
            /tmp/zmanager-macos-ci/*.zip
            /tmp/zmanager-macos-ci/*.dmg
            /tmp/zmanager-macos-ci/inspection-*.json

      - name: Upload macOS packaging diagnostics
        if: failure() && matrix.flavor == 'macos'
        uses: actions/upload-artifact@v6
        with:
          name: zmanager-macos-packaging-diagnostics-${{ matrix.arch }}
          if-no-files-found: ignore
          path: |
            /tmp/zmanager-macos-ci/*.app
            /tmp/zmanager-macos-ci/*.zip
            /tmp/zmanager-macos-ci/*.dmg
            /tmp/zmanager-macos-ci/.*-dmg-root/

      # ---- Windows ----
      - name: Prepare and build Windows package
        if: matrix.flavor == 'windows'
        shell: pwsh
        # The Windows build scripts redirect cargo output to a short CARGO_TARGET_DIR
        # (avoids MAX_PATH issues with deeply nested target paths); the upload paths
        # below must mirror this location.
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\zmbuild
        run: |
          .\scripts\prepare-windows-static-build.ps1 `
            -Environment prod `
            -Architecture ${{ matrix.arch }} `
            -InstallMissing `
            -InstallNodeModules `
            -Build

      - name: Upload Windows artifacts
        if: matrix.flavor == 'windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}\zmbuild\*\release\bundle\nsis\*.exe

      # ---- Linux DEB (Ubuntu) ----
      - name: Build Debian package
        if: matrix.flavor == 'linux-deb'
        shell: bash
        run: scripts/build-linux-ubuntu-deb.sh --install-deps --skip-tests --no-install

      - name: Upload Debian artifacts
        if: matrix.flavor == 'linux-deb'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            /tmp/zmanager-desktop-deb/*.deb

      # ---- Linux RPM (Fedora) ----
      - name: Install Fedora prerequisites
        if: matrix.flavor == 'linux-rpm'
        shell: bash
        run: |
          dnf install -y python3 git ripgrep ca-certificates
          npm ci
          scripts/ensure-sibling-repos.sh

      - name: Build RPM package
        if: matrix.flavor == 'linux-rpm'
        shell: bash
        run: scripts/build-linux-fedora-rpm.sh --install-deps --skip-tests --no-install

      - name: Upload RPM artifacts
        if: matrix.flavor == 'linux-rpm'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            /tmp/zmanager-desktop-rpm/*.rpm
