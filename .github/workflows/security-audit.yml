name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Recheck newly published advisories even without a dependency change.
    - cron: "37 20 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  npm:
    name: npm advisory gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      # Fail on every reported npm advisory, including low severity findings.
      - run: npm audit --audit-level=low
      - run: npm run test:security
      - run: node --test scripts/sibling-repository-contract.test.mjs scripts/third-party-license-generator.test.mjs

  rust:
    name: RustSec (${{ matrix.lockfile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lockfile:
          - src-tauri/Cargo.lock
          - native/windows-shell-extension/Cargo.lock
          - crates/zmanager-shell-contract/Cargo.lock
          - vendor/glib/Cargo.lock
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable install cargo-audit --locked --version 0.22.2
      # Audit every platform's committed resolution, without sibling checkouts.
      - run: cargo audit --deny yanked --file "${{ matrix.lockfile }}"

  glib:
    name: GLib backport regression (release)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev
      # The upstream public iterator tests reproduce the UB under optimization.
      - run: cargo test --manifest-path vendor/glib/Cargo.toml --locked --release --lib variant_iter::tests

  core:
    name: macOS FFI RustSec
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Read released sibling revisions
        id: core
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const entries = fs.readFileSync('release-build-inputs.lock', 'utf8')
            .split(/\r?\n/).filter(line => line.trim() && !line.trimStart().startsWith('#'))
            .map(line => line.trim().split(/\s+/));
          const coreRevision = entries.find(([name]) => name === 'zmanager')?.[3];
          const tzapRevision = entries.find(([name]) => name === 'tzap')?.[3];
          if (!/^[0-9a-f]{40}$/.test(coreRevision ?? '') || !/^[0-9a-f]{40}$/.test(tzapRevision ?? '')) {
            throw new Error('Release lock must pin full ZManager and TZAP commits');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `core_revision=${coreRevision}\ntzap_revision=${tzapRevision}\n`);
          NODE
      - uses: actions/checkout@v6
        with:
          repository: tzap-org/zmanager
          ref: ${{ steps.core.outputs.core_revision }}
          path: .audit/core
      - uses: actions/checkout@v6
        with:
          repository: tzap-org/tzap
          ref: ${{ steps.core.outputs.tzap_revision }}
          path: .audit/tzap
      - name: Prepare the pinned core's sibling inputs
        shell: bash
        run: |
          if [[ -f .audit/core/release-build-inputs.lock ]]; then
            ZMANAGER_SIBLING_PARENT_DIR="$GITHUB_WORKSPACE/.audit" \
              bash scripts/prepare-sibling-inputs.sh --mode snapshot \
                --lockfile .audit/core/release-build-inputs.lock
          else
            # The currently reviewed core commit predates its consolidated
            # lock; use the desktop lock, whose shared sibling SHAs match its
            # historical revision files. Newer core pins use their own lock.
            node scripts/checkout-release-inputs.mjs .audit
          fi
      - name: Verify shared package versions
        run: node scripts/check-shared-dependency-locks.mjs .audit/core/Cargo.lock src-tauri/Cargo.lock
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable install cargo-audit --locked --version 0.22.2
      # Match zmanager's successful audit: refresh lock entries resolved against
      # sibling TZAP, then audit the resulting core dependency graph.
      - name: Resolve sibling TZAP dependencies
        working-directory: .audit/core
        run: |
          cargo update --package tzap-core
          cargo update --package crypto-bigint
          cargo update --package url
      - name: Audit resolved core lockfile
        working-directory: .audit/core
        run: cargo audit --deny yanked --file Cargo.lock
